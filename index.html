<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYINYISOE - MASTER ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --accent: #0ea5e9; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --dark-bg: #020617; }
        body { font-family: 'Plus Jakarta Sans', 'Pyidaungsu', sans-serif; background: var(--dark-bg); color: white; margin: 0; padding: 0; }
        
        /* Sidebar */
        .sidebar { width: 260px; height: 100vh; background: #0f172a; position: fixed; border-right: 1px solid rgba(255,255,255,0.05); padding: 30px 20px; box-sizing: border-box; }
        .main-content { margin-left: 260px; padding: 40px; }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; }

        /* Form Card */
        .admin-form-card { background: rgba(255,255,255,0.03); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        input, select { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px; color: white; outline: none; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.3s; }
        .btn-add:hover { background: #0284c7; }

        /* Search & Filter Bar */
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .search-box { flex-grow: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 15px; color: #64748b; }
        .search-box input { width: 100%; padding-left: 45px; box-sizing: border-box; }

        /* Table */
        .table-container { background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1e293b; padding: 18px; font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        td { padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        /* Status Badges */
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; display: inline-block; transition: 0.2s; }
        .badge-processing { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .badge-completed { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge:hover { transform: scale(1.05); }

        .btn-action { background: none; border: none; color: #64748b; cursor: pointer; font-size: 16px; margin-right: 10px; }
        .btn-action:hover { color: var(--accent); }
        .btn-del:hover { color: var(--danger); }

        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-inputs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color: var(--accent);"><i class="fas fa-shield-alt"></i> ADMIN</h2>
    <p style="font-size: 12px; color: #64748b;">NEXUS CONTROL PANEL</p>
    <hr style="border: 0.1px solid rgba(255,255,255,0.05); margin: 30px 0;">
    <div style="color: #94a3b8; font-size: 14px; line-height: 2.5;">
        <p><i class="fas fa-list"></i> Client List</p>
        <p><i class="fas fa-money-bill-wave"></i> Revenue Report</p>
    </div>
</div>

<div class="main-content">
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-val" id="totalClients">0</span>
            <span class="stat-label">Total Clients</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="totalProcessing" style="color: var(--warning);">0</span>
            <span class="stat-label">Working</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="totalCompleted" style="color: var(--success);">0</span>
            <span class="stat-label">Finished</span>
        </div>
        <div class="stat-card">
            <span class="stat-val" id="totalRevenue" style="color: var(--success);">0</span>
            <span class="stat-label">Total Revenue (THB)</span>
        </div>
    </div>

    <div class="admin-form-card">
        <h3><i class="fas fa-edit"></i> Register New Client</h3>
        <div class="grid-inputs">
            <input type="text" id="passId" placeholder="Passport No. (ID)">
            <input type="text" id="clientName" placeholder="Client Name">
            <input type="text" id="agentName" placeholder="Agent Name">
            <select id="serviceType">
                <option value="New">Account ဖွင့်ခြင်း (500 THB)</option>
                <option value="Recovery">Account ဆယ်ခြင်း (800 THB)</option>
            </select>
            <select id="clientStatus">
                <option value="Processing">Processing</option>
                <option value="Completed">Completed</option>
            </select>
            <input type="text" id="startDate" placeholder="Date (e.g., 15 May)">
        </div>
        <button class="btn-add" id="saveBtn"><i class="fas fa-cloud-upload-alt"></i> Save to Firebase</button>
    </div>

    <div class="filter-bar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="filterInput" placeholder="Passport သို့မဟုတ် Agent နာမည်ဖြင့် ရှာရန်..." onkeyup="filterData()">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Passport ID</th>
                    <th>Client Name</th>
                    <th>Agent</th>
                    <th>Service</th>
                    <th>Status (Click to toggle)</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="clientTableBody"></tbody>
        </table>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCfiPIxd_uSO3J8PWyErkuUpZnmwBBlQ-c",
      authDomain: "nyinyisoedoerecoverservic.firebaseapp.com",
      projectId: "nyinyisoedoerecoverservic",
      storageBucket: "nyinyisoedoerecoverservic.firebasestorage.app",
      messagingSenderId: "944648367672",
      appId: "1:944648367672:web:5a614153128be23f88c0cd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let allData = []; // Local copy for filtering

    // Save Data
    document.getElementById('saveBtn').addEventListener('click', async () => {
        const id = document.getElementById('passId').value.toUpperCase().trim();
        const name = document.getElementById('clientName').value.trim();
        const agent = document.getElementById('agentName').value.trim();
        const status = document.getElementById('clientStatus').value;
        const type = document.getElementById('serviceType').value;
        const date = document.getElementById('startDate').value;

        if(!id || !name) return alert("ID နဲ့ နာမည် ဖြည့်ပါဦးဗျ!");

        await db.collection("clients").doc(id).set({
            name, agent, status, serviceType: type, startDate: date,
            updatedAt: new Date().toLocaleString()
        });
        alert("သိမ်းပြီးပါပြီ!");
        document.getElementById('passId').value = "";
        document.getElementById('clientName').value = "";
    });

    // Load Data
    db.collection("clients").onSnapshot(snapshot => {
        allData = [];
        snapshot.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
        renderTable(allData);
    });

    function renderTable(data) {
        let rows = "";
        let stats = { total: 0, processing: 0, done: 0, revenue: 0 };

        data.forEach(d => {
            stats.total++;
            if(d.status === 'Completed') stats.done++; else stats.processing++;
            stats.revenue += (d.serviceType === 'New' ? 500 : 800);

            rows += `
                <tr>
                    <td style="font-weight:800; color:var(--accent);">${d.id}</td>
                    <td>${d.name}</td>
                    <td>${d.agent || '-'}</td>
                    <td>${d.serviceType}</td>
                    <td>
                        <span class="badge ${d.status === 'Completed' ? 'badge-completed' : 'badge-processing'}" 
                              onclick="toggleStatus('${d.id}', '${d.status}')">
                            ${d.status}
                        </span>
                    </td>
                    <td>${d.startDate}</td>
                    <td>
                        <button class="btn-action" onclick="editDoc('${d.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-action btn-del" onclick="deleteDoc('${d.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });

        document.getElementById('clientTableBody').innerHTML = rows;
        document.getElementById('totalClients').innerText = stats.total;
        document.getElementById('totalProcessing').innerText = stats.processing;
        document.getElementById('totalCompleted').innerText = stats.done;
        document.getElementById('totalRevenue').innerText = stats.revenue.toLocaleString();
    }

    // Quick Toggle Status
    window.toggleStatus = async (id, current) => {
        const next = (current === 'Processing') ? 'Completed' : 'Processing';
        await db.collection("clients").doc(id).update({ status: next });
    };

    // Filter Function
    window.filterData = () => {
        const val = document.getElementById('filterInput').value.toLowerCase();
        const filtered = allData.filter(d => 
            d.id.toLowerCase().includes(val) || 
            (d.agent && d.agent.toLowerCase().includes(val)) ||
            d.name.toLowerCase().includes(val)
        );
        renderTable(filtered);
    };

    window.deleteDoc = (id) => { if(confirm("ဖျက်မှာ သေချာလား?")) db.collection("clients").doc(id).delete(); };

    window.editDoc = (id) => {
        const d = allData.find(x => x.id === id);
        document.getElementById('passId').value = d.id;
        document.getElementById('clientName').value = d.name;
        document.getElementById('agentName').value = d.agent;
        document.getElementById('clientStatus').value = d.status;
        document.getElementById('serviceType').value = d.serviceType;
        document.getElementById('startDate').value = d.startDate;
        window.scrollTo({top: 0, behavior: 'smooth'});
    };
</script>
</body>
</html>
