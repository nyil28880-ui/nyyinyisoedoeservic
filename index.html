<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - Database Only</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --main-color: #b89a5b;
            --font-style: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-style);
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .save-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .firebase-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .firebase-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        #captureArea {
            padding: 20px;
            background: #f4f4f4;
        }

        .card {
            width: 340px;
            background-color: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border: 3px solid var(--main-color);
            text-align: center;
            position: relative;
        }

        .header-black {
            background-color: #000;
            height: 110px;
            padding-top: 20px;
        }

        .header-title {
            color: var(--main-color);
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
            outline: none;
            text-transform: uppercase;
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            background-color: white;
            border-radius: 50%;
            margin: -70px auto 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid white;
            cursor: pointer;
            overflow: hidden;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
        }

        .content { padding: 20px 25px 10px; }

        .name {
            font-size: 24px;
            font-weight: 800;
            color: #222;
            margin-bottom: 15px;
            display: inline-block;
            outline: none;
        }

        .info-table {
            width: 100%;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .label { font-weight: bold; color: #333; }

        .value {
            color: #666;
            word-break: break-all;
            text-align: right;
            outline: none;
            min-width: 100px;
        }

        .recovery-text {
            font-size: 13px;
            color: #d9534f;
            font-weight: bold;
            margin: 10px 0;
            padding: 5px;
            border-top: 1px dashed #ddd;
            outline: none;
        }

        .card-footer {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        .line-icon {
            background-color: #00c300;
            color: white;
            padding: 4px;
            border-radius: 5px;
            font-size: 12px;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="color" id="colorPicker" value="#b89a5b" onchange="updateColor(this.value)">
        <button class="firebase-btn" id="uploadBtn" onclick="uploadToFirebase()">Save Data ☁️</button>
        <button class="save-btn" onclick="saveAsImage()">Download Card 📥</button>
    </div>

    <div id="captureArea">
        <div class="card" id="profileCard">
            <div class="header-black">
                <h3 class="header-title" id="cardTitle" contenteditable="true">DOE FOREIGNER</h3>
            </div>

            <div class="profile-container" onclick="document.getElementById('fileInput').click()">
                <div class="profile-img-container">
                    <img src="https://via.placeholder.com/130" class="profile-img" id="displayImg">
                </div>
                <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
            </div>

            <div class="content">
                <div class="name" id="cardName" contenteditable="true">Name</div>
                
                <div class="info-table">
                    <div class="info-row">
                        <span class="label">Gmail:</span>
                        <span class="value" id="cardGmail" contenteditable="true">yourname@hotmail.com</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Password:</span>
                        <span class="value" id="cardPassword" contenteditable="true">112025Day</span>
                    </div>
                    <div class="info-row">
                        <span class="label">PIN Code:</span>
                        <span class="value" id="cardPin" contenteditable="true">112025</span>
                    </div>
                </div>

                <div class="recovery-text" id="cardRecovery" contenteditable="true">
                    အကောင့်ဆယ်ချင်သူများဆက်သွယ်ရန်
                </div>
            </div>

            <div class="card-footer">
                <div class="contact-item">
                    <i class="fab fa-line line-icon"></i>
                    <span id="cardLine" contenteditable="true">Line ID: 0617718247</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-phone-alt" style="color: #444;"></i>
                    <span id="cardPhone" contenteditable="true">0940460610</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Firestore Only SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA3WtuqOYsuv1LpGyj3pfWtsOnpAlUMfUc",
            authDomain: "profile-card-7f6f7.firebaseapp.com",
            projectId: "profile-card-7f6f7",
            storageBucket: "profile-card-7f6f7.firebasestorage.app",
            messagingSenderId: "154937714474",
            appId: "1:154937714474:web:ce8e1a76d5fcc3b5bb2053",
            measurementId: "G-MJR2JMWYEE"
        };

        // Initialize Firebase & Firestore Only
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let base64ImgString = "https://via.placeholder.com/130";

        window.updateColor = function(color) {
            document.documentElement.style.setProperty('--main-color', color);
        }

        // ဓာတ်ပုံကို ရွေးလိုက်တာနဲ့ Size အသေးဆုံးဖြစ်အောင် ကျုံ့ပြီး စာသား (Base64) ပြောင်းတဲ့အပိုင်း
        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // Canvas သုံးပြီး ပုံကို 140x140 size အထိ ချုံ့ပစ်လိုက်ပါတယ် (Database နေရာမစားအောင်လို့ပါ)
                        const canvas = document.createElement('canvas');
                        canvas.width = 140;
                        canvas.height = 140;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 140, 140);
                        
                        // ပုံထွက်အရည်အသွေးကို 60% ထိ လျှော့ချပြီး စာသားပြောင်းပါတယ်
                        base64ImgString = canvas.toDataURL('image/jpeg', 0.6);
                        document.getElementById('displayImg').src = base64ImgString;
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        window.saveAsImage = function() {
            const area = document.getElementById('captureArea');
            html2canvas(area, { useCORS: true, scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'profile-card.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // 1. Load data from Firebase Firestore
        async function loadCardData() {
            try {
                const docRef = doc(db, "cards", "saved_card");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('cardTitle').innerText = data.title || "DOE FOREIGNER";
                    document.getElementById('cardName').innerText = data.name || "Name";
                    document.getElementById('cardGmail').innerText = data.gmail || "yourname@hotmail.com";
                    document.getElementById('cardPassword').innerText = data.password || "112025Day";
                    document.getElementById('cardPin').innerText = data.pin || "112025";
                    document.getElementById('cardRecovery').innerText = data.recovery || "အကောင့်ဆယ်ချင်သူများဆက်သွယ်ရန်";
                    document.getElementById('cardLine').innerText = data.line || "Line ID: 0617718247";
                    document.getElementById('cardPhone').innerText = data.phone || "0940460610";
                    
                    if(data.color) {
                        document.getElementById('colorPicker').value = data.color;
                        updateColor(data.color);
                    }
                    if (data.imageBase64) {
                        base64ImgString = data.imageBase64;
                        document.getElementById('displayImg').src = data.imageBase64;
                    }
                }
            } catch (error) {
                console.error("Error loading data: ", error);
            }
        }

        // 2. Save only text & compressed image string to Firestore
        window.uploadToFirebase = async function() {
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = "Saving... ⏳";
            uploadBtn.disabled = true;

            try {
                const cardData = {
                    title: document.getElementById('cardTitle').innerText,
                    name: document.getElementById('cardName').innerText,
                    gmail: document.getElementById('cardGmail').innerText,
                    password: document.getElementById('cardPassword').innerText,
                    pin: document.getElementById('cardPin').innerText,
                    recovery: document.getElementById('cardRecovery').innerText,
                    line: document.getElementById('cardLine').innerText,
                    phone: document.getElementById('cardPhone').innerText,
                    color: document.getElementById('colorPicker').value,
                    imageBase64: base64ImgString, // ပုံကို စာသားပြောင်းပြီး ဒေတာဘေ့စ်ထဲမှာပဲ သိမ်းလိုက်ခြင်း
                    updatedAt: new Date()
                };

                await setDoc(doc(db, "cards", "saved_card"), cardData);
                alert("အချက်အလက်များကို အခမဲ့ Database ထဲသို့ အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ! 🎉");

            } catch (error) {
                console.error("Error saving data: ", error);
                alert("ဒေတာသိမ်းလို့မရပါဘူး။ Firebase Console > Firestore Database > Rules ထဲမှာ Allow Read, Write: if true; လုပ်ထားလား ပြန်စစ်ပေးပါ။");
            } finally {
                uploadBtn.innerText = "Save Data ☁️";
                uploadBtn.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>
